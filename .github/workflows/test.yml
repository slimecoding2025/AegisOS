name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml python3-pytest
      - name: Run tests (ShellCheck, manifest validation, pytest)
        run: make test
      - name: Static verification (config, secrets patterns, generated docs)
        run: make verify
      - name: Build Aegis .deb packages
        run: make debs
  trixie-packages:
    name: package names resolve on Debian 13 trixie
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git python3 python3-yaml
      - uses: actions/checkout@v4
      - name: Check ISO package lists resolve (fails if any are missing)
        run: ./scripts/check-package-lists.sh
      - name: Report which manifest candidates resolve (informational)
        run: PYTHONPATH=packages/aegis-core python3 -m aegis.cli manifest check-packages
