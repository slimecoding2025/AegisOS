name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            grub-efi-amd64-bin dpkg-dev python3 python3-yaml git ca-certificates gh
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Test
        run: make test
      - name: Build ISO and checksums
        run: make build
      - name: Verify
        run: make verify
      - name: Create GitHub Release (only when explicitly enabled)
        if: vars.AEGIS_PUBLISH_RELEASES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "${GITHUB_REF_NAME}" dist/AegisOS-*-amd64.iso dist/SHA256SUMS \
            --title "AegisOS ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
      - name: Keep artifacts when publishing is disabled
        if: vars.AEGIS_PUBLISH_RELEASES != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aegisos-release-candidate
          path: |
            dist/AegisOS-*-amd64.iso
            dist/SHA256SUMS
