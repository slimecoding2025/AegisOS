name: release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            grub-efi-amd64-bin dpkg-dev python3 python3-yaml git ca-certificates gh
      - uses: actions/checkout@v7
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Test
        run: make test
      - name: Build ISO and checksums
        run: make build
      - name: Verify
        run: make verify
      - name: ISO must fit GitHub's 2 GiB per-asset limit
        run: |
          for f in dist/AegisOS-*-amd64.iso; do
            size=$(stat -c %s "$f")
            echo "$f is $size bytes"
            if [ "$size" -ge 2147483648 ]; then
              echo "error: GitHub release assets must be under 2 GiB" >&2
              exit 1
            fi
          done
      - name: Create GitHub Release (only when explicitly enabled)
        if: vars.AEGIS_PUBLISH_RELEASES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          flags=""
          case "$(tr -d '[:space:]' < VERSION)" in 0.*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" dist/AegisOS-*-amd64.iso dist/SHA256SUMS \
            --title "AegisOS ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md $flags
      - name: Keep artifacts when publishing is disabled
        if: vars.AEGIS_PUBLISH_RELEASES != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aegisos-release-candidate
          path: |
            dist/AegisOS-*-amd64.iso
            dist/SHA256SUMS
