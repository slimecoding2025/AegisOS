# AegisOS tool manifest - the single source of truth for the tool ecosystem.
#
# Honesty rules (enforced by `aegis manifest validate`):
#  * `package` is a CANDIDATE Debian package name, not a verified one. It is
#    resolved against the configured APT repositories at install time
#    (`aegis manifest check-packages`). Tools with installation_method other
#    than `apt` have no package assumed.
#  * license / homepage / documentation / redistribution / version default to
#    `unverified`. Nothing is invented. Fill these in only from the upstream
#    project or the Debian package metadata, then record the source.
#  * `bundled: true` (shipped inside the ISO) is only legal when the license is
#    verified, redistribution is `allowed` and the method is `apt`.
#  * `tier` states intent: core (planned for the ISO), optional (installable
#    from APT), external (not from APT), containerized, development, specialized.
schema_version: 1

# Verification log (rendered into docs/TOOLS.md). Add a line whenever a host check is performed.
verification_log:
  - "2026-10-03: `aegis manifest check-packages` on an AegisOS 0.1.0 live image (Debian 13.7, VMware Workstation, sources main/contrib/non-free-firmware): 95 apt candidates resolved, 13 did not and were moved to external. A candidate only proves apt knows the name; installation and operation were not tested."
  - "2026-10-04: GitHub Actions workflow `test` (run #4, commit c04a7c4) finished successfully. It includes the `trixie-packages` job, which fails if any package in the ISO package lists or the core tier has no candidate on a `debian:trixie` container, so those names resolve there. Job details were not inspected beyond the overall success status."

defaults:
  bundled: false
  license: unverified
  homepage: unverified
  documentation: unverified
  redistribution: unverified
  version: unverified
  dependencies: []
  package: null

categories:
  network:              {title: Network Security,   usage_notice: authorized}
  dns:                  {title: Network Security,   usage_notice: authorized}
  web:                  {title: Web Security,       usage_notice: authorized}
