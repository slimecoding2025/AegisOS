  forensics:            {title: Digital Forensics}
  blue-team:            {title: Blue Team}
  soc:                  {title: SOC}
  reverse-engineering:  {title: Reverse Engineering}
  malware-analysis:     {title: Reverse Engineering, usage_notice: lab}
  wireless:             {title: Wireless,           usage_notice: authorized}
  password-auditing:    {title: Utilities,          usage_notice: authorized}
  active-directory:     {title: Network Security,   usage_notice: authorized}
  cloud:                {title: Cloud Security}
  containers:           {title: Container Security}
  privacy:              {title: Utilities}
  cryptography:         {title: Utilities}
  system-administration: {title: System Administration}
